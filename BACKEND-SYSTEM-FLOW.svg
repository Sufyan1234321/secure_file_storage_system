<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title description">
  <title id="title">Secure File Storage Backend System Flow</title>
  <desc id="description">Backend request flow from Express entry point through middleware, routes, controllers, services, MongoDB and local file storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#e9784e"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#183337" flood-opacity=".12"/></filter>
    <style>
      .title{font:600 40px Georgia,serif;fill:#183337}.sub{font:16px 'Segoe UI',sans-serif;fill:#718184}.h{font:600 19px 'Segoe UI',sans-serif;fill:#183337}.p{font:13px 'Segoe UI',sans-serif;fill:#718184}.label{font:600 11px Consolas,monospace;fill:#718184;letter-spacing:1px}.box{fill:#fbfaf7;stroke:#c8d1ca;stroke-width:2;rx:12;filter:url(#shadow)}.entry{stroke:#315fca}.middleware{stroke:#698d78}.route{stroke:#e9784e}.logic{stroke:#d8865d}.db{stroke:#28736a}.disk{stroke:#315fca}.reject{stroke:#a85d50}.arrow{stroke:#e9784e;stroke-width:3;fill:none;marker-end:url(#arrow)}.lane{fill:#f8f9f6;stroke:#dfe3dc;stroke-width:2;rx:14}
    </style>
  </defs>
  <rect width="1200" height="1500" fill="#f5f1ea"/>
  <text x="70" y="70" class="label">BACKEND SYSTEM FLOW</text>
  <text x="70" y="120" class="title">Express API Request Lifecycle</text>
  <text x="70" y="155" class="sub">Every request is validated, authenticated, authorized, processed, and persisted</text>

  <rect x="50" y="205" width="1100" height="210" class="lane"/>
  <text x="80" y="242" class="label">1 · APPLICATION ENTRY</text>
  <rect x="100" y="275" width="300" height="100" class="box entry"/>
  <text x="135" y="315" class="h">server.js</text>
  <text x="135" y="345" class="p">Load environment and connect MongoDB</text>
  <text x="135" y="365" class="p">Start Express on PORT</text>
  <path d="M400 325 H520" class="arrow"/>
  <rect x="520" y="275" width="300" height="100" class="box route"/>
  <text x="555" y="315" class="h">app.js</text>
  <text x="555" y="345" class="p">CORS, JSON parser, Morgan logging</text>
  <text x="555" y="365" class="p">Helmet security headers</text>
  <path d="M820 325 H940" class="arrow"/>
  <rect x="940" y="275" width="160" height="100" class="box middleware"/>
  <text x="970" y="315" class="h">Rate limit</text>
  <text x="970" y="345" class="p">Auth requests</text>
  <text x="970" y="365" class="p">20 / 15 min</text>

  <rect x="50" y="455" width="1100" height="275" class="lane"/>
  <text x="80" y="492" class="label">2 · ROUTING AND SECURITY</text>
  <rect x="100" y="525" width="290" height="135" class="box route"/>
  <text x="135" y="565" class="h">Route matching</text>
  <text x="135" y="598" class="p">/api/auth/*</text>
  <text x="135" y="622" class="p">/api/files/*</text>
  <text x="135" y="646" class="p">/api/share/:token</text>
  <path d="M390 590 H490" class="arrow"/>
  <rect x="490" y="525" width="300" height="135" class="box middleware"/>
  <text x="525" y="565" class="h">protect middleware</text>
  <text x="525" y="598" class="p">Read Bearer token</text>
  <text x="525" y="622" class="p">Verify JWT signature and expiry</text>
  <text x="525" y="646" class="p">Load current user from MongoDB</text>
  <path d="M790 590 H890" class="arrow"/>
  <rect x="890" y="525" width="210" height="135" class="box middleware"/>
  <text x="920" y="565" class="h">Authorization</text>
  <text x="920" y="598" class="p">Owner or admin?</text>
  <text x="920" y="622" class="p">Admin-only routes</text>
  <text x="920" y="646" class="p">401 / 403 if denied</text>

  <path d="M995 660 V755" class="arrow"/>
  <text x="1015" y="712" class="label">ALLOWED</text>
  <rect x="100" y="755" width="1000" height="180" class="lane"/>
  <text x="130" y="792" class="label">3 · REQUEST PROCESSING</text>
  <rect x="180" y="825" width="260" height="75" class="box route"/>
  <text x="215" y="858" class="h">Controller</text>
  <text x="215" y="882" class="p">Request-specific behavior</text>
  <path d="M440 862 H540" class="arrow"/>
  <rect x="540" y="825" width="260" height="75" class="box logic"/>
  <text x="575" y="858" class="h">Service layer</text>
  <text x="575" y="882" class="p">Business logic and validation</text>
  <path d="M800 862 H900" class="arrow"/>
  <rect x="900" y="825" width="150" height="75" class="box db"/>
  <text x="925" y="858" class="h">Models</text>
  <text x="925" y="882" class="p">User / File</text>

  <rect x="50" y="975" width="1100" height="245" class="lane"/>
  <text x="80" y="1012" class="label">4 · FILE UPLOAD EXAMPLE</text>
  <rect x="100" y="1045" width="245" height="125" class="box middleware"/>
  <text x="130" y="1085" class="h">Multer</text>
  <text x="130" y="1118" class="p">Filename and MIME allowlist</text>
  <text x="130" y="1142" class="p">110 MB file limit</text>
  <text x="130" y="1166" class="p">Random UUID filename</text>
  <path d="M345 1107 H450" class="arrow"/>
  <rect x="450" y="1045" width="300" height="125" class="box logic"/>
  <text x="480" y="1085" class="h">file.controller.js</text>
  <text x="480" y="1118" class="p">Check 5 GB user quota</text>
  <text x="480" y="1142" class="p">Set owner, folder, visibility</text>
  <text x="480" y="1166" class="p">Generate share token if public</text>
  <path d="M750 1107 H855" class="arrow"/>
  <rect x="855" y="1045" width="245" height="125" class="box db"/>
  <text x="885" y="1085" class="h">Persist result</text>
  <text x="885" y="1118" class="p">MongoDB: metadata</text>
  <text x="885" y="1142" class="p">uploads: file bytes</text>
  <text x="885" y="1166" class="p">JSON response to client</text>

  <rect x="50" y="1260" width="1100" height="175" class="box reject"/>
  <text x="85" y="1305" class="h">Failure and lifecycle paths</text>
  <text x="85" y="1340" class="p">Invalid token → 401 · insufficient permission → 403 · invalid file → 422 · quota exceeded → 413</text>
  <text x="85" y="1370" class="p">Delete → isTrashed=true → restore or permanent delete bytes + metadata</text>
  <text x="85" y="1400" class="p">Public link → validate shareToken + isPublic=true → stream from uploads</text>
</svg>
